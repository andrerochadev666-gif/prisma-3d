<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Prisma 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0EA5E9', darkBg: '#0F172A', cardBg: '#1E293B' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased">

    <!-- Tela de Login -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-cardBg p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-lg shadow-primary/30">P</div>
                <h1 class="text-2xl font-black text-white">Painel Administrativo</h1>
                <p class="text-slate-400 text-sm">Digite a senha para gerenciar o site</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Senha de Acesso</label>
                    <input type="password" id="admin-pass" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-primary transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3.5 rounded-xl bg-primary hover:bg-sky-600 text-white font-bold text-sm shadow-lg shadow-primary/30 transition">
                    Entrar no Painel
                </button>
                <div id="login-error" class="hidden text-center text-rose-400 text-sm font-medium">Senha incorreta. Tente "admin123".</div>
            </form>
            <div class="text-center">
                <a href="index.html" class="text-xs text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-left mr-1"></i> Voltar para o site público</a>
            </div>
        </div>
    </div>

    <!-- Painel Principal (Oculto até login) -->
    <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
        <header class="bg-cardBg border-b border-slate-800 h-20 px-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white font-bold">P</div>
                <span class="text-lg font-bold text-white">Gestão Prisma 3D</span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="saveChanges()" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm shadow-lg shadow-emerald-500/20 transition">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Salvar e Publicar Alterações
                </button>
                <button onclick="logout()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition" title="Sair">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-6xl w-full mx-auto p-6 sm:p-8 space-y-8">
            <!-- Configurações Gerais -->
            <div class="bg-cardBg p-6 rounded-3xl border border-slate-800 space-y-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-gear text-primary"></i> Configurações Gerais</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Nome da Marca</label>
                        <input type="text" id="input-brand-name" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white">
                    </div>
                </div>
            </div>

            <!-- Gerenciamento de Serviços -->
            <div class="bg-cardBg p-6 rounded-3xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-cubes text-primary"></i> Serviços Cadastrados</h2>
                    <button onclick="addServiceItem()" class="px-4 py-2 rounded-xl bg-primary text-white text-sm font-semibold">Adicionar Serviço</button>
                </div>
                <div id="admin-services-list" class="space-y-4"></div>
            </div>

            <!-- Gerenciamento de Portfólio -->
            <div class="bg-cardBg p-6 rounded-3xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-images text-primary"></i> Portfólio</h2>
                    <button onclick="addPortfolioItem()" class="px-4 py-2 rounded-xl bg-primary text-white text-sm font-semibold">Adicionar Projeto</button>
                </div>
                <div id="admin-portfolio-list" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <script>
        let currentData = {};

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                initAdmin();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        function logout() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function initAdmin() {
            const saved = localStorage.getItem('prisma_site_data');
            currentData = saved ? JSON.parse(saved) : {
                brandName: "Prisma 3D",
                services: [
                    { title: "Peças Personalizadas", desc: "Desenvolvimento de itens exclusivos.", icon: "fa-cube" },
                    { title: "Brindes e Chaveiros", desc: "Brindes corporativos marcantes.", icon: "fa-key" }
                ],
                portfolio: [
                    { title: "Miniatura Colecionável", category: "Miniaturas", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80" }
                ],
                faq: []
            };

            document.getElementById('input-brand-name').value = currentData.brandName;
            renderAdminServices();
            renderAdminPortfolio();
        }

        function renderAdminServices() {
            const container = document.getElementById('admin-services-list');
            container.innerHTML = currentData.services.map((s, idx) => `
                <div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <div class="flex-1 space-y-2">
                        <input type="text" value="${s.title}" onchange="currentData.services[${idx}].title = this.value" class="w-full px-3 py-2 bg-slate-800 rounded-lg text-white text-sm">
                        <input type="text" value="${s.desc}" onchange="currentData.services[${idx}].desc = this.value" class="w-full px-3 py-2 bg-slate-800 rounded-lg text-slate-300 text-sm">
                    </div>
                    <button onclick="currentData.services.splice(${idx}, 1); renderAdminServices();" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function addServiceItem() {
            currentData.services.push({ title: "Novo Serviço", desc: "Descrição do serviço", icon: "fa-cube" });
            renderAdminServices();
        }

        function renderAdminPortfolio() {
            const container = document.getElementById('admin-portfolio-list');
            container.innerHTML = currentData.portfolio.map((p, idx) => `
                <div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 flex items-center gap-4">
                    <img src="${p.image}" class="w-16 h-16 object-cover rounded-xl">
                    <div class="flex-1 space-y-2">
                        <input type="text" value="${p.title}" onchange="currentData.portfolio[${idx}].title = this.value" class="w-full px-3 py-2 bg-slate-800 rounded-lg text-white text-sm">
                        <input type="text" value="${p.image}" onchange="currentData.portfolio[${idx}].image = this.value" class="w-full px-3 py-2 bg-slate-800 rounded-lg text-slate-300 text-sm" placeholder="URL da imagem">
                    </div>
                    <button onclick="currentData.portfolio.splice(${idx}, 1); renderAdminPortfolio();" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function addPortfolioItem() {
            currentData.portfolio.push({ title: "Novo Projeto", category: "Geral", image: "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=800&q=80" });
            renderAdminPortfolio();
        }

        function saveChanges() {
            currentData.brandName = document.getElementById('input-brand-name').value;
            localStorage.setItem('prisma_site_data', JSON.stringify(currentData));
            alert("Alterações salvas com sucesso! Atualize a página principal para ver o resultado.");
        }
    </script>
</body>
</html>
